# Copy to ~/Library/Application Support/irie/config.toml (macOS)
# or ~/.config/irie/config.toml (Linux). Every key is optional.

device_name = "irie"     # name shown in Spotify Connect device lists
bitrate = 320            # 96, 160 or 320
initial_volume = 60      # percent
normalisation = false    # volume normalisation between tracks
autoconnect = true       # take over playback on start if nothing is playing
backend = "auto"         # "auto", "web" (macOS/Windows) or "librespot"
# player_url = "https://irie.frandika.com/player"
audio_cache_mb = 1024    # 0 disables the audio cache
oauth_port = 8989        # local port irie listens on for the login
# redirect_uri = "https://irie.frandika.com/callback"  # only with your own client_id
# client_id = "..."      # your own Spotify app for the Web API (see README)
