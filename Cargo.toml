[package]
name = "irie"
version = "0.2.0"
edition = "2024"
description = "A Spotify client for the terminal: play music, visualize audio, browse playlists, manage the queue, and host Jams."
license = "MIT"
repository = "https://github.com/jovanfrandika/irie"
readme = "README.md"
keywords = ["spotify", "tui", "music", "cli", "librespot"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
librespot-core = "0.8.0"
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend"] }
librespot-connect = "0.8.0"
librespot-metadata = "0.8.0"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.10", features = ["derive"] }
anyhow = "1"
directories = "6.0.0"
rustfft = "6.4.1"
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
toml = "0.8"
http = "1.3"
sha1 = "0.10"
url = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"

# The web player (Spotify's Web Playback SDK in the system web view) only works
# where the system web view supports DRM: WebKit on macOS, WebView2 on Windows.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "=0.57.4"
tao = "=0.37.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# librespot-core's build script breaks with vergen 9.1; keep it on 9.0.x.
[build-dependencies]
vergen = "=9.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
